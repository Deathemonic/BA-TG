name: Build and Pack

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        type: string
      region:
        type: choice
        required: true
        options:
          - japan
          - global
      commit:
        type: string
        required: false
        default: ""
      dry_run:
        type: boolean
        default: false

jobs:
  schema:
    name: Fetch schema
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and sanitize schema
        env:
          FBS_REPO: ${{ secrets.FBS_REPO }}
          FBS_TOKEN: ${{ secrets.FBS_REPO_PAT }}
          FBS_NS_ROOT: ${{ secrets.FBS_NS_ROOT }}
          REGION: ${{ inputs.region }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$REGION" = "japan" ]; then
            BRANCH="japan-android-mx"
            FILE="Japan.fbs"
          else
            BRANCH="global-android-mx"
            FILE="Global.fbs"
          fi

          REF="${COMMIT:-$BRANCH}"

          curl -sSL --fail -H "Authorization: token ${FBS_TOKEN}" \
            "https://raw.githubusercontent.com/${FBS_REPO}/${REF}/${FILE}" \
            -o raw_schema.fbs

          mkdir -p schema

          REGION_CASED=$(echo "$REGION" | sed 's/./\U&/')
          python3 - "$FBS_NS_ROOT" "$REGION_CASED" raw_schema.fbs schema/table.fbs <<'PY'
          import re, sys
          ns_root, region, in_path, out_path = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          prefix = f"{ns_root}.{region}"
          pattern = re.compile(r"^(\s*namespace\s+)" + re.escape(prefix) + r"(\.[A-Za-z0-9_.]+)?\s*;\s*$")
          with open(in_path, encoding="utf-8") as f:
              text = f.read()
          out_lines = []
          for line in text.splitlines():
              m = pattern.match(line)
              if m:
                  rest = m.group(2)
                  if rest:
                      out_lines.append(f"namespace {rest.lstrip('.')};")
                  continue
              out_lines.append(line)
          result = "\n".join(out_lines)
          result = re.sub(r"\n{3,}", "\n\n", result)
          with open(out_path, "w", encoding="utf-8") as f:
              f.write(result.strip() + "\n")
          PY

      - name: Upload schema
        uses: actions/upload-artifact@v7
        with:
          name: schema
          path: schema/table.fbs

  build:
    name: Build ${{ matrix.config.target }}
    needs: [schema]
    if: always() && (needs.schema.result == 'success' || needs.schema.result == 'skipped')
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, artifact: libbatg_flatbuffers.so, cross: false }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, artifact: libbatg_flatbuffers.so, cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, artifact: batg_flatbuffers.dll, cross: false }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, artifact: batg_flatbuffers.dll, cross: false }
          - { os: macos-latest, target: x86_64-apple-darwin, artifact: libbatg_flatbuffers.dylib, cross: false }
          - { os: macos-latest, target: aarch64-apple-darwin, artifact: libbatg_flatbuffers.dylib, cross: false }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, artifact: libbatg_flatbuffers.so, cross: false }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl, artifact: libbatg_flatbuffers.so, cross: false }
          - { os: ubuntu-26.04, target: aarch64-linux-android, artifact: libbatg_flatbuffers.so, cross: true }
          - { os: ubuntu-26.04, target: armv7-linux-androideabi, artifact: libbatg_flatbuffers.so, cross: true }
          - { os: ubuntu-26.04, target: x86_64-linux-android, artifact: libbatg_flatbuffers.so, cross: true }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: BA-TG

      - name: Checkout private dependency
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CUNNYBUFFERS_REPO }}
          token: ${{ secrets.CUNNYBUFFERS_PAT }}
          path: CunnyBuffer

      - name: Download schema
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: schema
          path: BA-TG/schema

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            BA-TG/target
          key: batg-${{ runner.os }}-${{ matrix.config.target }}-${{ hashFiles('BA-TG/Cargo.lock') }}

      - name: Build
        if: ${{ !matrix.config.cross && !contains(matrix.config.target, 'musl') }}
        working-directory: BA-TG
        shell: bash
        env:
          CUNNYBUFFER: ${{ github.workspace }}/CunnyBuffer
        run: cargo build --release --target ${{ matrix.config.target }} -p batg-flatbuffers

      - name: Install musl-tools
        if: ${{ contains(matrix.config.target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (musl, native runner)
        if: ${{ contains(matrix.config.target, 'musl') }}
        working-directory: BA-TG
        shell: bash
        env:
          CUNNYBUFFER: ${{ github.workspace }}/CunnyBuffer
          RUSTFLAGS: -C target-feature=-crt-static
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.config.target }} -p batg-flatbuffers

      - name: Build (Android, NDK clang)
        if: ${{ contains(matrix.config.target, 'android') }}
        working-directory: BA-TG
        shell: bash
        env:
          CUNNYBUFFER: ${{ github.workspace }}/CunnyBuffer
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=24
          case "${{ matrix.config.target }}" in
            aarch64-linux-android)   CLANG="aarch64-linux-android$API-clang" ;;
            armv7-linux-androideabi) CLANG="armv7a-linux-androideabi$API-clang" ;;
            x86_64-linux-android)    CLANG="x86_64-linux-android$API-clang" ;;
          esac
          T="${{ matrix.config.target }}"
          TU="${T//-/_}"
          TUU="$(echo "$TU" | tr '[:lower:]' '[:upper:]')"
          export "CC_$TU=$BIN/$CLANG"
          export "AR_$TU=$BIN/llvm-ar"
          export "CARGO_TARGET_${TUU}_LINKER=$BIN/$CLANG"
          cargo build --release --target "$T" -p batg-flatbuffers

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.target }}
          path: BA-TG/target/${{ matrix.config.target }}/release/${{ matrix.config.artifact }}

  pack:
    name: Pack
    needs: [build]
    runs-on: ubuntu-latest
    env:
      FLAT_NAME: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}.flat', inputs.region, inputs.tag) || format('game-{0}.flat', github.ref_name) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: BA-TG

      - name: Checkout private dependency
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CUNNYBUFFERS_REPO }}
          token: ${{ secrets.CUNNYBUFFERS_PAT }}
          path: CunnyBuffer

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack
        working-directory: BA-TG
        run: |
          cargo run --release -p batg-pack -- pack --output "../$FLAT_NAME" \
            --add x86_64-unknown-linux-gnu ../artifacts/x86_64-unknown-linux-gnu/libbatg_flatbuffers.so \
            --add aarch64-unknown-linux-gnu ../artifacts/aarch64-unknown-linux-gnu/libbatg_flatbuffers.so \
            --add x86_64-unknown-linux-musl ../artifacts/x86_64-unknown-linux-musl/libbatg_flatbuffers.so \
            --add aarch64-unknown-linux-musl ../artifacts/aarch64-unknown-linux-musl/libbatg_flatbuffers.so \
            --add aarch64-linux-android ../artifacts/aarch64-linux-android/libbatg_flatbuffers.so \
            --add armv7-linux-androideabi ../artifacts/armv7-linux-androideabi/libbatg_flatbuffers.so \
            --add x86_64-linux-android ../artifacts/x86_64-linux-android/libbatg_flatbuffers.so \
            --add x86_64-pc-windows-msvc ../artifacts/x86_64-pc-windows-msvc/batg_flatbuffers.dll \
            --add aarch64-pc-windows-msvc ../artifacts/aarch64-pc-windows-msvc/batg_flatbuffers.dll \
            --add x86_64-apple-darwin ../artifacts/x86_64-apple-darwin/libbatg_flatbuffers.dylib \
            --add aarch64-apple-darwin ../artifacts/aarch64-apple-darwin/libbatg_flatbuffers.dylib
          cargo run --release -p batg-pack -- list "../$FLAT_NAME"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FLAT_NAME }}
          path: ${{ env.FLAT_NAME }}

      - name: Compute release tag
        if: (github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.dry_run != true)
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REGION="${{ inputs.region }}"
            REGION_CASED=$(echo "$REGION" | sed 's/./\U&/')
            echo "value=${REGION_CASED}-${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: (github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.dry_run != true)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: ${{ env.FLAT_NAME }}
          body: "‎ "
          generate_release_notes: false
          append_body: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
