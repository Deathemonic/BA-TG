name: Build and Pack

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        type: string
      region:
        type: choice
        required: true
        options:
          - japan
          - global
      commit:
        type: string
        required: false
        default: ""
      dry_run:
        type: boolean
        default: false

jobs:
  setup:
    name: Setup schema revision
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      region: ${{ steps.resolve.outputs.region }}
    steps:
      - name: Resolve schema revision
        id: resolve
        env:
          FBS_REPO: ${{ secrets.FBS_REPO }}
          FBS_TOKEN: ${{ secrets.FBS_REPO_PAT }}
          REGION: ${{ inputs.region }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          : "${FBS_REPO:?Missing FBS_REPO}"
          : "${FBS_TOKEN:?Missing FBS_REPO_PAT}"
          if [ -z "$REGION" ]; then
            case "$RELEASE_TAG" in
              Japan-*|japan-*) REGION=japan ;;
              Global-*|global-*) REGION=global ;;
              *) echo "Release tag must start with Japan- or Global-." >&2; exit 1 ;;
            esac
          fi

          case "$REGION" in
            japan) schema_branch=japan-android-mx ;;
            global) schema_branch=global-android-mx ;;
            *) echo "Unsupported schema region." >&2; exit 1 ;;
          esac
          schema_ref="${COMMIT:-$schema_branch}"
          schema_ref=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$schema_ref")
          schema_sha=$(curl -fsSL -H "Authorization: Bearer $FBS_TOKEN" \
            -H "Accept: application/vnd.github.sha" \
            "https://api.github.com/repos/$FBS_REPO/commits/$schema_ref")
          if [[ ! "$schema_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Schema repository did not return a valid commit SHA." >&2
            exit 1
          fi
          printf 'sha=%s\nregion=%s\n' "$schema_sha" "$REGION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.config.target }}
    needs: [setup]
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-26.04, target: x86_64-unknown-linux-gnu, artifact: libbatg_flatbuffers.so }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-gnu, artifact: libbatg_flatbuffers.so }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, artifact: batg_flatbuffers.dll }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, artifact: batg_flatbuffers.dll }
          - { os: macos-latest, target: x86_64-apple-darwin, artifact: libbatg_flatbuffers.dylib }
          - { os: macos-latest, target: aarch64-apple-darwin, artifact: libbatg_flatbuffers.dylib }
          - { os: ubuntu-26.04, target: x86_64-unknown-linux-musl, artifact: libbatg_flatbuffers.so }
          - { os: ubuntu-26.04-arm, target: aarch64-unknown-linux-musl, artifact: libbatg_flatbuffers.so }
          - { os: ubuntu-26.04, target: aarch64-linux-android, artifact: libbatg_flatbuffers.so }
          - { os: ubuntu-26.04, target: armv7-linux-androideabi, artifact: libbatg_flatbuffers.so }
          - { os: ubuntu-26.04, target: x86_64-linux-android, artifact: libbatg_flatbuffers.so }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: BA-TG

      - name: Checkout private dependency
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CUNNYBUFFERS_REPO }}
          token: ${{ secrets.CUNNYBUFFERS_PAT }}
          path: CunnyBuffer

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Fetch schema
        working-directory: BA-TG
        shell: bash
        env:
          FBS_REPO: ${{ secrets.FBS_REPO }}
          FBS_TOKEN: ${{ secrets.FBS_REPO_PAT }}
          FBS_NS_ROOT: ${{ secrets.FBS_NS_ROOT }}
          REGION: ${{ needs.setup.outputs.region }}
          SCHEMA_SHA: ${{ needs.setup.outputs.sha }}
        run: bash .github/scripts/fetch-schema.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.config.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: batg-deps-${{ runner.os }}-${{ matrix.config.target }}-${{ hashFiles('BA-TG/Cargo.lock') }}

      - name: Setup
        if: ${{ contains(matrix.config.target, 'musl') }}
        run: pip3 install --break-system-packages ziglang cargo-zigbuild

      - name: Build
        working-directory: BA-TG
        shell: bash
        env:
          CUNNYBUFFER: ${{ github.workspace }}/CunnyBuffer
          BUILD_TARGET: ${{ matrix.config.target }}
        run: |
          cargo_subcommand=build
          case "$BUILD_TARGET" in
            *-musl)
              cargo_subcommand=zigbuild
              export RUSTFLAGS="-C target-feature=-crt-static"
              ;;
            *-android*)
              ndk_root="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
              ndk_bin="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin"
              clang_target="$BUILD_TARGET"
              if [ "$BUILD_TARGET" = "armv7-linux-androideabi" ]; then
                clang_target=armv7a-linux-androideabi
              fi
              clang_path="$ndk_bin/${clang_target}24-clang"
              target_key="${BUILD_TARGET//-/_}"
              export "CC_${target_key}=$clang_path"
              export "AR_${target_key}=$ndk_bin/llvm-ar"
              export "CARGO_TARGET_${target_key^^}_LINKER=$clang_path"
              ;;
          esac
          cargo "$cargo_subcommand" --release --target "$BUILD_TARGET" -p batg-flatbuffers

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.target }}
          path: BA-TG/target/${{ matrix.config.target }}/release/${{ matrix.config.artifact }}

  pack:
    name: Pack
    needs: [build]
    runs-on: ubuntu-26.04
    env:
      FLAT_NAME: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}.flat', inputs.region, inputs.tag) || format('game-{0}.flat', github.ref_name) }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: BA-TG

      - name: Checkout private dependency
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.CUNNYBUFFERS_REPO }}
          token: ${{ secrets.CUNNYBUFFERS_PAT }}
          path: CunnyBuffer

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack
        working-directory: BA-TG
        run: |
          cargo run --release -p batg-pack -- pack --output "../$FLAT_NAME" \
            --add x86_64-unknown-linux-gnu ../artifacts/x86_64-unknown-linux-gnu/libbatg_flatbuffers.so \
            --add aarch64-unknown-linux-gnu ../artifacts/aarch64-unknown-linux-gnu/libbatg_flatbuffers.so \
            --add x86_64-unknown-linux-musl ../artifacts/x86_64-unknown-linux-musl/libbatg_flatbuffers.so \
            --add aarch64-unknown-linux-musl ../artifacts/aarch64-unknown-linux-musl/libbatg_flatbuffers.so \
            --add aarch64-linux-android ../artifacts/aarch64-linux-android/libbatg_flatbuffers.so \
            --add armv7-linux-androideabi ../artifacts/armv7-linux-androideabi/libbatg_flatbuffers.so \
            --add x86_64-linux-android ../artifacts/x86_64-linux-android/libbatg_flatbuffers.so \
            --add x86_64-pc-windows-msvc ../artifacts/x86_64-pc-windows-msvc/batg_flatbuffers.dll \
            --add aarch64-pc-windows-msvc ../artifacts/aarch64-pc-windows-msvc/batg_flatbuffers.dll \
            --add x86_64-apple-darwin ../artifacts/x86_64-apple-darwin/libbatg_flatbuffers.dylib \
            --add aarch64-apple-darwin ../artifacts/aarch64-apple-darwin/libbatg_flatbuffers.dylib
          cargo run --release -p batg-pack -- list "../$FLAT_NAME"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FLAT_NAME }}
          path: ${{ env.FLAT_NAME }}

      - name: Create release tag
        if: (github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.dry_run != true)
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REGION="${{ inputs.region }}"
            REGION_CASED=$(echo "$REGION" | sed 's/./\U&/')
            echo "value=${REGION_CASED}-${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: (github.event_name == 'release') || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.dry_run != true)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: ${{ env.FLAT_NAME }}
          body: "‎ "
          generate_release_notes: false
          append_body: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
